<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SimplyApps social cover</title>
  <desc id="desc">Portada social de SimplyApps con fondo azul y mensaje de software a medida para empresas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F3552" />
      <stop offset="1" stop-color="#1C6193" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1020" cy="120" r="140" fill="#2E86C1" fill-opacity="0.28" />
  <circle cx="180" cy="520" r="220" fill="#5DADE2" fill-opacity="0.18" />
  <text x="90" y="240" fill="white" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700">SimplyApps</text>
  <text x="90" y="320" fill="#D6EAF8" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="500">Software a medida para empresas</text>
  <text x="90" y="390" fill="#D6EAF8" font-family="Inter, Arial, sans-serif" font-size="30">Apps nativas • Web empresarial • Backend robusto</text>
</svg>
